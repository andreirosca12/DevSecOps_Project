openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Liveness/DB check
      responses:
        "200": {description: ok}
        "503": {description: database unavailable}
  /register:
    post:
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "201": {description: created}
        "400": {description: validation error}
        "409": {description: username taken}
  /login:
    post:
      summary: Get an auth token
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credentials"}
      responses:
        "200": {description: token}
        "401": {description: bad credentials}
  /notes:
    get:
      summary: List my notes
      security: [{bearerAuth: []}]
      responses:
        "200": {description: list}
        "401": {description: unauthorized}
    post:
      summary: Create a note
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string}
                body: {type: string}
      responses:
        "201": {description: created}
        "400": {description: validation error}
  /notes/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: Get one of my notes
      security: [{bearerAuth: []}]
      responses:
        "200": {description: note}
        "404": {description: not found}
    delete:
      summary: Delete one of my notes
      security: [{bearerAuth: []}]
      responses:
        "204": {description: deleted}
        "404": {description: not found}
  /search:
    get:
      summary: Search note titles
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: matches}
  /fetch:
    get:
      summary: Link preview
      parameters:
        - {name: url, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: info}
        "400": {description: missing url}
  /hello:
    get:
      summary: Greeting
      parameters:
        - {name: name, in: query, schema: {type: string}}
      responses:
        "200": {description: html greeting}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string}
